<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗記カード</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
<div id="drop" class="hidden fixed inset-0 z-50 bg-indigo-600/80 text-white text-2xl font-bold flex items-center justify-center">.xlsx / .csv ファイルをここにドロップ</div>

<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-bold tracking-tight">暗記カード</h1>
      <select id="cat" class="border border-slate-700 bg-slate-800 text-slate-100 rounded-lg px-3 py-1.5 text-sm"></select>
      <span id="pos" class="text-sm text-slate-400 font-mono"></span>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <label class="btn cursor-pointer">ファイル選択<input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" class="hidden"></label>
      <button id="paste" class="btn">貼り付け</button>
      <button id="view" class="btn">一覧</button>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
  <section id="cardView" class="grid gap-6">
    <div id="card" class="bg-slate-900 rounded-2xl border border-slate-800 p-8 md:p-12 min-h-[20rem] cursor-pointer select-none grid gap-6 content-start shadow-xl transition-colors hover:border-slate-700"></div>
    <div class="grid grid-cols-2 gap-4">
      <button id="prev" class="btn py-3.5 text-base">← 前へ</button>
      <button id="next" class="btn py-3.5 text-base">次へ →</button>
    </div>
    <p class="text-center text-slate-500 text-sm">スペース / クリック：解答を表示　｜　← / → キー：前後のカードへ移動</p>
  </section>

  <section id="listView" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></section>
</main>

<dialog id="dlg" class="rounded-xl p-0 w-full max-w-2xl bg-slate-900 text-slate-100 border border-slate-700 backdrop:bg-black/70">
  <div class="p-5 grid gap-3">
    <h2 class="font-bold text-lg">CSV / スプレッドシートを貼り付け</h2>
    <p class="text-sm text-slate-400">1行1問で「カテゴリ, 問題, 解答」（または「問題, 解答」）の順に入力してください。</p>
    <textarea id="ta" rows="12" class="border border-slate-700 bg-slate-800 text-slate-100 rounded p-3 font-mono text-sm w-full" placeholder="カテゴリ,問題,解答"></textarea>
    <div class="flex justify-end gap-2">
      <button id="dc" class="btn">キャンセル</button>
      <button id="dok" class="btn !bg-indigo-600 !border-indigo-500 !text-white hover:!bg-indigo-500">読み込む</button>
    </div>
  </div>
</dialog>

<style type="text/tailwindcss">
  @layer components {
    .btn { @apply px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-100 hover:bg-slate-700 font-medium transition-colors; }
  }
</style>

<script type="text/plain" id="sample">
カテゴリ,問題,解答
"色覚の多様性","日本人男性で、P型とD型の色覚を持つ人の割合はおおよそどのくらい？","約5%（約20人に1人）"
"色覚の多様性","日本人女性で、P型とD型の色覚を持つ人の割合はおおよそどのくらい？","約0.2%（約500人に1人）"
"加齢と見え方","加齢により水晶体が白濁して光が散乱し、「かすんで見える」「まぶしく感じる（グレア）」「コントラストが低下する」といった変化が起きる症状を何という？","白内障"
"PCCSカラートーンサークル","「さえた、鮮やかな、派手な、目立つ、生き生きした」イメージのトーンは？","v (vivid)"
"PCCSカラートーンサークル","「強い、くどい、動的な、情熱的な」イメージのトーンは？","s (strong)"
"PCCSカラートーンサークル","「明るい、健康的な、陽気な、華やかな」イメージのトーンは？","b (bright)"
"PCCSカラートーンサークル","「浅い、澄んだ、子供っぽい、さわやかな、楽しい」イメージのトーンは？","lt (light)"
"PCCSカラートーンサークル","「薄い、軽い、あっさりした、弱い、女性的、若々しい、優しい、淡い、かわいい」イメージのトーンは？","p (pale)"
"PCCSカラートーンサークル","「濃い、深い、充実した、伝統的な、和風の」イメージのトーンは？","dp (deep)"
"PCCSカラートーンサークル","「暗い、大人っぽい、円熟した、丈夫な」イメージのトーンは？","dk (dark)"
"PCCSカラートーンサークル","「暗い灰みの、陰気な、重い、堅い、男性的」イメージのトーンは？","dkg (dark-grayish)"
"PCCSカラートーンサークル","「柔らかな、穏やかな、ぼんやりした」イメージのトーンは？","sf (soft)"
"PCCSカラートーンサークル","「鈍い、くすんだ、中間色の」イメージのトーンは？","d (dull / dall)"
"PCCSカラートーンサークル","「明るい灰みの、落ち着いた、渋い、おとなしい」イメージのトーンは？","ltg (light-grayish)"
"PCCSカラートーンサークル","「灰みの、濁った、地味な」イメージのトーンは？","g (grayish)"
</script>

<script>
const $ = id => document.getElementById(id);
const KEY = 'uc-flashcards-csv-v5';
const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');

// CSV / TSV パーサー（「カテゴリ, 問題, 解答」の3列、または「問題, 解答」の2列に対応）
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  if (!text) return [];
  const firstLine = text.split('\n')[0];
  const sep = firstLine.includes('\t') && !firstLine.includes(',') ? '\t' : ',';

  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === sep) { row.push(cur.trim()); cur = ''; }
      else if (ch === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
  }
  row.push(cur.trim());
  if (row.some(x => x)) rows.push(row);
  if (!rows.length) return [];

  let cCol = -1, qCol = 0, aCol = 1, start = 0;
  const h = rows[0].map(x => x.toLowerCase());
  const isHeader = h.some(x => /^(カテゴリ|カテゴリー|category|分野|章)$/.test(x)) ||
                   h.some(x => /^(問題|question|q|表|おもて)$/.test(x)) ||
                   h.some(x => /^(解答|回答|答え|answer|a|裏|うら)$/.test(x));

  if (isHeader) {
    start = 1;
    const fc = h.findIndex(x => /^(カテゴリ|カテゴリー|category|分野|章)$/.test(x));
    const fq = h.findIndex(x => /^(問題|question|q|表|おもて)$/.test(x));
    const fa = h.findIndex(x => /^(解答|回答|答え|answer|a|裏|うら)$/.test(x));
    if (fc >= 0) cCol = fc;
    if (fq >= 0) qCol = fq;
    if (fa >= 0) aCol = fa;
  } else if (rows[0].length >= 3) {
    cCol = 0; qCol = 1; aCol = 2;
  }

  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    const cat = (cCol >= 0 ? (r[cCol] || '') : '').trim() || '未分類';
    const q = (r[qCol] || '').replace(/<br\s*\/?>/gi, '\n').trim();
    const a = (r[aCol] || '').replace(/<br\s*\/?>/gi, '\n').trim();
    if (q && a) out.push({ cat, q, a });
  }
  return out;
}

let allCards = [], view = [], idx = 0, flipped = false, listMode = false;
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (Array.isArray(saved) && saved.length) allCards = saved;
} catch (e) {}
if (!allCards.length) allCards = parseCSV($('sample').textContent);

function buildCats() {
  const cur = $('cat').value;
  const cats = [...new Set(allCards.map(c => c.cat))];
  $('cat').innerHTML = '<option value="">すべてのカテゴリ</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
  $('cat').value = cats.includes(cur) ? cur : '';
}

function applyFilter() {
  const c = $('cat').value;
  view = allCards.filter(x => !c || x.cat === c);
  idx = Math.min(idx, Math.max(view.length - 1, 0));
}

function loadText(text) {
  const list = parseCSV(text);
  if (!list.length) return alert('データを読み取れませんでした。「カテゴリ, 問題, 解答」の形式になっているか確認してください。');
  allCards = list;
  idx = 0;
  flipped = false;
  localStorage.setItem(KEY, JSON.stringify(allCards));
  buildCats();
  applyFilter();
  render();
}

async function readFile(file) {
  if (!file) return;
  const buf = await file.arrayBuffer();
  if (/\.xlsx?$/i.test(file.name) && typeof XLSX !== 'undefined') {
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const csv = XLSX.utils.sheet_to_csv(ws);
    loadText(csv);
    return;
  }
  let text = new TextDecoder('utf-8', { fatal: false }).decode(buf);
  if (text.includes('\uFFFD')) {
    try { text = new TextDecoder('shift-jis').decode(buf); } catch (e) {}
  }
  loadText(text);
}

function render() {
  $('cardView').classList.toggle('hidden', listMode);
  $('listView').classList.toggle('hidden', !listMode);
  $('view').textContent = listMode ? 'カード表示' : '一覧';
  $('pos').textContent = view.length ? `${idx + 1} / ${view.length}` : '0 / 0';

  if (listMode) {
    $('listView').innerHTML = view.map((c, i) => `
      <div data-i="${i}" class="cursor-pointer bg-slate-900 border border-slate-800 hover:border-indigo-500 rounded-xl p-5 grid gap-3 content-start transition-colors">
        <div class="flex items-center justify-between text-xs text-slate-400">
          <span class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-md">${esc(c.cat)}</span>
          <span class="font-mono">Q${i + 1}</span>
        </div>
        <div class="text-base font-bold text-slate-100 leading-relaxed">${esc(c.q)}</div>
        <div class="text-base text-indigo-300 border-t border-slate-800 pt-3 leading-relaxed">${esc(c.a)}</div>
      </div>`).join('');
    return;
  }

  const c = view[idx];
  if (!c) {
    $('card').innerHTML = '<p class="text-lg text-slate-400 text-center">カードがありません</p>';
    return;
  }

  $('card').innerHTML = `
    <div class="flex items-center justify-between">
      <span class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1 rounded-md font-medium">${esc(c.cat)}</span>
      <span class="text-xs font-mono text-indigo-400 tracking-wider">QUESTION ${idx + 1}</span>
    </div>
    <div class="text-xl md:text-2xl font-bold leading-relaxed text-slate-100">${esc(c.q)}</div>
    ${flipped ? `
      <hr class="border-slate-800 my-1">
      <div class="text-xs font-mono text-emerald-400 tracking-wider">ANSWER</div>
      <div class="text-lg md:text-xl font-medium leading-relaxed text-slate-100">${esc(c.a)}</div>
    ` : '<p class="text-base text-slate-500 text-center pt-10">クリック または スペースキーで解答を表示</p>'}
  `;
}

const go = d => { if (!view.length) return; idx = (idx + d + view.length) % view.length; flipped = false; render(); };
const flip = () => { flipped = !flipped; render(); };

$('card').onclick = flip;
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('cat').onchange = () => { idx = 0; flipped = false; applyFilter(); render(); };
$('view').onclick = () => { listMode = !listMode; render(); };
$('listView').onclick = e => {
  const d = e.target.closest('[data-i]');
  if (d) { idx = +d.dataset.i; flipped = false; listMode = false; render(); }
};

$('file').onchange = e => { readFile(e.target.files[0]); e.target.value = ''; };
$('paste').onclick = () => $('dlg').showModal();
$('dc').onclick = () => $('dlg').close();
$('dok').onclick = () => { loadText($('ta').value); $('dlg').close(); $('ta').value = ''; };

let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('drop').classList.remove('hidden'); });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('drop').classList.add('hidden'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('drop').classList.add('hidden'); readFile(e.dataTransfer.files[0]); });

addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || $('dlg').open || listMode) return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

buildCats();
applyFilter();
render();
</script>
</body>
</html>
