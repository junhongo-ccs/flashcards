<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel de 暗記カード</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
<div id="drop" class="hidden fixed inset-0 z-50 bg-indigo-600/80 text-white text-2xl font-bold flex items-center justify-center">.xlsx / .csv ファイルをここにドロップ</div>

<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-lg font-bold tracking-tight flex items-center gap-2"><span class="material-symbols-outlined text-indigo-400 text-[26px] leading-none" aria-hidden="true">lightbulb</span>Excel de 暗記カード</h1>
    <div class="flex flex-wrap items-center justify-end gap-2 text-sm ml-auto">
      <button id="reloadBtn" class="btn hidden" title="選択中のファイルを再読込"><span class="material-symbols-outlined text-[20px] leading-none align-middle mr-1 -mt-0.5">refresh</span>再読込</button>
      <button id="pickBtn" class="btn">QAファイル選択</button>
      <input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" class="hidden">
    </div>
  </div>
</header>

<div class="max-w-4xl mx-auto px-4 pt-6 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3">
    <select id="cat" class="border border-slate-700 bg-slate-800 text-slate-100 rounded-lg px-3 py-1.5 text-sm"></select>
  </div>
  <div class="flex flex-wrap items-center justify-end gap-3 ml-auto text-sm">
    <div class="flex items-center gap-2">
      <span class="text-slate-400">QA順</span>
      <div class="inline-flex rounded-lg border border-slate-700 bg-slate-950 p-0.5">
        <button id="orderAsIs" class="px-3.5 py-1.5 rounded-md font-medium transition-colors" title="Excel に書いた順で出題">設定のまま</button>
        <button id="orderShuffle" class="px-3.5 py-1.5 rounded-md font-medium transition-colors" title="カテゴリをまたがず、カテゴリ内で問題をシャッフル（押すたびにシャッフルし直し）"><span class="material-symbols-outlined text-[18px] leading-none align-middle mr-1 -mt-0.5">shuffle</span>シャッフル</button>
      </div>
    </div>
    <div class="inline-flex rounded-lg border border-slate-700 bg-slate-950 p-0.5">
      <button id="modeQuiz" class="px-3.5 py-1.5 rounded-md font-medium transition-colors">問題</button>
      <button id="modeList" class="px-3.5 py-1.5 rounded-md font-medium transition-colors">QA一覧</button>
    </div>
  </div>
</div>

<main class="max-w-4xl mx-auto px-4 pt-6 pb-8">
  <section id="cardView" class="grid gap-6">
    <div class="grid grid-cols-[auto_1fr_auto] items-stretch gap-3">
      <button id="prev" class="btn !px-0 w-12 md:w-14 text-3xl font-bold text-slate-300" aria-label="前のカード" title="前のカード（解答は隠れた状態）（← キー）">&lt;</button>
      <div id="card" class="relative overflow-hidden bg-slate-900 rounded-2xl border border-slate-800 p-8 md:p-12 min-h-[20rem] cursor-pointer select-none grid gap-6 content-start shadow-xl transition-colors hover:border-slate-700"></div>
      <button id="next" class="btn !px-0 w-12 md:w-14 text-3xl font-bold text-slate-300" aria-label="解答を表示 / 次のカード" title="解答を表示 → 次のカード（→ キー）">&gt;</button>
    </div>
    <p class="text-center text-slate-500 text-sm">&gt; ボタン / → キー：解答を表示 → 次のカードへ　｜　&lt; ボタン / ← キー：前のカードへ（解答は隠れた状態）</p>
  </section>

  <section id="listView" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></section>
</main>

<style type="text/tailwindcss">
  @layer components {
    .btn { @apply px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-100 hover:bg-slate-700 font-medium transition-colors; }
  }
</style>

</script>

<script>
const $ = id => document.getElementById(id);
const KEY = 'uc-flashcards-csv-v5';
const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');

// CSV / TSV パーサー（「カテゴリ, 問題, 解答」の3列、または「問題, 解答」の2列に対応）
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  if (!text) return [];
  const firstLine = text.split('\n')[0];
  const sep = firstLine.includes('\t') && !firstLine.includes(',') ? '\t' : ',';

  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === sep) { row.push(cur.trim()); cur = ''; }
      else if (ch === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
      else cur += ch;
    }
  }
  row.push(cur.trim());
  if (row.some(x => x)) rows.push(row);
  if (!rows.length) return [];

  let cCol = -1, qCol = 0, aCol = 1, start = 0;
  const h = rows[0].map(x => x.toLowerCase());
  const isHeader = h.some(x => /^(カテゴリ|カテゴリー|category|分野|章)$/.test(x)) ||
                   h.some(x => /^(問題|question|q|表|おもて)$/.test(x)) ||
                   h.some(x => /^(解答|回答|答え|answer|a|裏|うら)$/.test(x));

  if (isHeader) {
    start = 1;
    const fc = h.findIndex(x => /^(カテゴリ|カテゴリー|category|分野|章)$/.test(x));
    const fq = h.findIndex(x => /^(問題|question|q|表|おもて)$/.test(x));
    const fa = h.findIndex(x => /^(解答|回答|答え|answer|a|裏|うら)$/.test(x));
    if (fc >= 0) cCol = fc;
    if (fq >= 0) qCol = fq;
    if (fa >= 0) aCol = fa;
  } else if (rows[0].length >= 3) {
    cCol = 0; qCol = 1; aCol = 2;
  }

  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    const cat = (cCol >= 0 ? (r[cCol] || '') : '').trim() || '未分類';
    const q = (r[qCol] || '').replace(/<br\s*\/?>/gi, '\n').trim();
    const a = (r[aCol] || '').replace(/<br\s*\/?>/gi, '\n').trim();
    if (q && a) out.push({ cat, q, a });
  }
  return out;
}

let allCards = [], view = [], idx = 0, flipped = false, listMode = false, shuffled = false, listCards = [];
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (Array.isArray(saved) && saved.length) allCards = saved;
} catch (e) {}
if (!allCards.length) allCards = parseCSV($('sample').textContent);

function buildCats() {
  const cur = $('cat').value;
  const cats = [...new Set(allCards.map(c => c.cat))];
  $('cat').innerHTML = '<option value="">すべてのカテゴリ</option>' + cats.map(c => `<option>${esc(c)}</option>`).join('');
  $('cat').value = cats.includes(cur) ? cur : '';
}

function applyFilter() {
  const c = $('cat').value;
  view = allCards.filter(x => !c || x.cat === c);
  if (shuffled) view = shuffleInCats(view);
  idx = Math.min(idx, Math.max(view.length - 1, 0));
}

// カテゴリの並びはそのまま、各カテゴリ内の問題だけをシャッフル
function shuffleInCats(list) {
  const groups = new Map();
  list.forEach(x => { if (!groups.has(x.cat)) groups.set(x.cat, []); groups.get(x.cat).push(x); });
  return [...groups.values()].flatMap(g => {
    for (let i = g.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [g[i], g[j]] = [g[j], g[i]];
    }
    return g;
  });
}

function loadText(text) {
  const list = parseCSV(text);
  if (!list.length) return alert('データを読み取れませんでした。「カテゴリ, 問題, 解答」の形式になっているか確認してください。');
  allCards = list;
  idx = 0;
  flipped = false;
  localStorage.setItem(KEY, JSON.stringify(allCards));
  buildCats();
  applyFilter();
  render();
}

async function readFile(file) {
  if (!file) return;
  const buf = await file.arrayBuffer();
  if (/\.xlsx?$/i.test(file.name) && typeof XLSX !== 'undefined') {
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const csv = XLSX.utils.sheet_to_csv(ws);
    loadText(csv);
    return;
  }
  let text = new TextDecoder('utf-8', { fatal: false }).decode(buf);
  if (text.includes('\uFFFD')) {
    try { text = new TextDecoder('shift-jis').decode(buf); } catch (e) {}
  }
  loadText(text);
}

function render() {
  $('cardView').classList.toggle('hidden', listMode);
  $('listView').classList.toggle('hidden', !listMode);
  const seg = on => `px-3.5 py-1.5 rounded-md font-medium transition-colors ${on ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`;
  $('modeQuiz').className = seg(!listMode);
  $('modeList').className = seg(listMode);
  $('orderAsIs').className = seg(!shuffled);
  $('orderShuffle').className = seg(shuffled);

  if (listMode) {
    // QA一覧は資料として見るため、シャッフルに関係なく元の順で表示
    const c0 = $('cat').value;
    listCards = allCards.filter(x => !c0 || x.cat === c0);
    $('listView').innerHTML = listCards.map((c, i) => `
      <div data-i="${i}" class="cursor-pointer bg-slate-900 border border-slate-800 hover:border-indigo-500 rounded-xl p-5 grid gap-3 content-start transition-colors">
        <div class="flex items-center justify-between text-xs text-slate-400">
          <span class="bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-md">${esc(c.cat)}</span>
          <span class="font-mono">Q${i + 1}</span>
        </div>
        <div class="text-base font-bold text-slate-100 leading-relaxed">${esc(c.q)}</div>
        <div class="text-base text-indigo-300 border-t border-slate-800 pt-3 leading-relaxed">${esc(c.a)}</div>
      </div>`).join('');
    return;
  }

  const c = view[idx];
  if (!c) {
    $('card').innerHTML = '<p class="text-lg text-slate-400 text-center">カードがありません</p>';
    return;
  }

  $('card').innerHTML = `
    <div class="absolute inset-x-0 bottom-0 h-1 bg-slate-800" aria-hidden="true">
      <div class="h-full bg-blue-500 transition-all duration-300" style="width:${(idx + 1) / view.length * 100}%"></div>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1 rounded-md font-medium">${esc(c.cat)}</span>
      <span class="font-mono text-indigo-400 tracking-wider" aria-label="${view.length}問中 ${idx + 1}問目"><span class="text-sm">QUESTION ${idx + 1}</span><span class="text-xs text-slate-500"> / ${view.length}</span></span>
    </div>
    <div class="text-xl md:text-2xl font-bold leading-relaxed text-slate-100">${esc(c.q)}</div>
    ${flipped ? `
      <hr class="border-slate-800 my-1">
      <div class="text-xs font-mono text-emerald-400 tracking-wider">ANSWER</div>
      <div class="text-lg md:text-xl font-medium leading-relaxed text-slate-100">${esc(c.a)}</div>
    ` : `
      <div class="flex justify-center pt-8">
        <button type="button" class="btn inline-flex items-center justify-center gap-2 w-full max-w-xl !px-6 !py-3 text-base">
          <span class="material-symbols-outlined text-[22px] leading-none" aria-hidden="true">visibility</span>解答を表示
          <kbd class="ml-1 text-xs font-sans text-slate-400 border border-slate-600 rounded px-1.5 py-0.5">または &gt; ボタン / → キー</kbd>
        </button>
      </div>
    `}
  `;
}

const go = d => { if (!view.length) return; idx = (idx + d + view.length) % view.length; flipped = false; render(); };
const flip = () => { flipped = !flipped; render(); };

$('card').onclick = flip;
$('prev').onclick = () => go(-1);
// > は「解答を表示 → 次のカードへ」の2段階。< は常に解答を隠した状態で前のカードへ
const next = () => { if (!view.length) return; if (!flipped) flip(); else go(1); };
$('next').onclick = next;
$('cat').onchange = () => { idx = 0; flipped = false; applyFilter(); render(); };
const setOrder = s => { shuffled = s; idx = 0; flipped = false; applyFilter(); render(); };
$('orderAsIs').onclick = () => setOrder(false);
$('orderShuffle').onclick = () => setOrder(true);
$('modeQuiz').onclick = () => { listMode = false; render(); };
$('modeList').onclick = () => { listMode = true; render(); };
$('listView').onclick = e => {
  const d = e.target.closest('[data-i]');
  if (d) { idx = Math.max(view.indexOf(listCards[+d.dataset.i]), 0); flipped = false; listMode = false; render(); }
};

$('file').onchange = e => { readFile(e.target.files[0]); e.target.value = ''; };

// File System Access API + IndexedDB で1回選んだファイルを記憶し「再読込」で即反映
let fileHandle = null;
const dbReq = () => new Promise((res, rej) => {
  const r = indexedDB.open('uc-flashcards-db', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const saveHandle = async h => {
  try { const db = await dbReq(); db.transaction('kv', 'readwrite').objectStore('kv').put(h, 'fileHandle'); } catch (e) {}
};
const loadHandle = async () => {
  try {
    const db = await dbReq();
    return await new Promise(res => {
      const g = db.transaction('kv', 'readonly').objectStore('kv').get('fileHandle');
      g.onsuccess = () => res(g.result || null);
      g.onerror = () => res(null);
    });
  } catch (e) { return null; }
};

function updateReloadBtn() {
  if (fileHandle) {
    $('reloadBtn').classList.remove('hidden');
    $('reloadBtn').innerHTML = `<span class="material-symbols-outlined text-[20px] leading-none align-middle mr-1 -mt-0.5">refresh</span>再読込 (${esc(fileHandle.name)})`;
  }
}

async function reloadFromHandle(askPerm) {
  if (!fileHandle) return;
  try {
    let perm = await fileHandle.queryPermission({ mode: 'read' });
    if (perm !== 'granted' && askPerm) perm = await fileHandle.requestPermission({ mode: 'read' });
    if (perm === 'granted') {
      const f = await fileHandle.getFile();
      await readFile(f);
    }
  } catch (e) {
    if (askPerm) alert('ファイルの再読込に失敗しました。もう一度「QAファイル選択」から選び直してください。');
  }
}

$('pickBtn').onclick = async () => {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: 'Excel / CSV', accept: { 'application/octet-stream': ['.xlsx', '.xls', '.csv', '.tsv', '.txt'] } }]
      });
      fileHandle = h;
      await saveHandle(h);
      updateReloadBtn();
      await reloadFromHandle(true);
    } catch (e) {}
  } else {
    $('file').click();
  }
};

$('reloadBtn').onclick = () => reloadFromHandle(true);

let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('drop').classList.remove('hidden'); });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('drop').classList.add('hidden'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; $('drop').classList.add('hidden');
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  if (item && item.getAsFileSystemHandle) {
    try {
      const h = await item.getAsFileSystemHandle();
      if (h && h.kind === 'file') {
        fileHandle = h;
        await saveHandle(h);
        updateReloadBtn();
        await reloadFromHandle(true);
        return;
      }
    } catch (err) {}
  }
  readFile(e.dataTransfer.files[0]);
});

addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || listMode) return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

buildCats();
applyFilter();
render();
loadHandle().then(h => { if (h) { fileHandle = h; updateReloadBtn(); reloadFromHandle(false); } });
</script>
</body>
</html>
